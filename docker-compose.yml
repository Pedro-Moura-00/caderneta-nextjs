# Caderneta do Bar: banco + aplicação.
#   docker compose up -d --build      -> abre em http://localhost:8080
# Só o banco (para desenvolver com npm run dev): docker compose up -d db
#
# Ajustes de cada máquina ficam num arquivo .env nesta pasta (fora do git), ex.:
#   BAR_NOME=Bar do Will
#   PORTA=8080
#   BAR_SEED=1          (dados de exemplo na primeira vez)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bar_will
      POSTGRES_USER: bar_will
      POSTGRES_PASSWORD: bar_will_local
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${PORTA_BANCO:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bar_will", "-d", "bar_will"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bar_will:bar_will_local@db:5432/bar_will
      BAR_NOME: ${BAR_NOME:-Bar do Will}
      # 1 = cria dados de exemplo na primeira vez (só com o banco vazio)
      BAR_SEED: ${BAR_SEED:-0}
    ports:
      - "${PORTA:-8080}:3000"

volumes:
  pg_data:
