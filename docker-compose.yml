services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bar_will
      POSTGRES_USER: bar_will
      POSTGRES_PASSWORD: bar_will_local
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bar_will", "-d", "bar_will"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:
